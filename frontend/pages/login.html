<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - ConnectLocal</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <!-- Main Auth Container -->
    <main class="auth-wrapper">
        
        <!-- Left Side: Login Form -->
        <section class="left-panel">
            <header class="auth-header">
                <a href="../index.html" class="logo">
                    <img src="../assets/logo/logo.svg" alt="ConnectLocal Logo" style="height: 38px; width: auto; display: block;">
                </a>
            </header>

            <div class="auth-content">
                <div class="auth-form-title">
                    <h2>Welcome back!</h2>
                    <p>Please enter your login details below</p>
                </div>

                <form id="login-form" onsubmit="return false;">
                    <!-- Email Address -->
                    <div class="form-group form-group-auth">
                        <div class="input-container">
                            <input type="email" id="email" class="form-input" placeholder="Email Address" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group form-group-auth">
                        <div class="password-toggle-container">
                            <input type="password" id="password" class="form-input" placeholder="Password" required>
                            <i class="far fa-eye input-icon" id="toggle-password"></i>
                        </div>
                    </div>

                    <!-- Forgot Password Link -->
                    <a href="#" class="forgot-password-link" id="forgot-password">Forgot password?</a>

                    <!-- Submit Button -->
                    <button type="submit" id="btn-login" class="btn btn-primary btn-auth-submit">Log In</button>

                    <!-- Divider -->
                    <div class="divider">or continue</div>

                    <!-- Google Authentication Button -->
                    <button type="button" id="btn-google-login" class="btn-google">
                        <!-- Standard Google SVG Logo -->
                        <svg width="18" height="18" viewBox="0 0 18 18">
                            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.938 5.48 18 9 18z" fill="#34A853"/>
                            <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.173 0 7.549 0 9s.347 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.896 11.428 0 9 0 5.48 0 2.438 2.062.957 4.961L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>
                </form>
            </div>

            <footer class="auth-footer-link">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </footer>
        </section>

        <!-- Right Side: Graphic Sidebar -->
        <section class="right-panel">
            <!-- Deco Floating Shapes -->
            <div class="deco-shape circle-deco"></div>
            <div class="deco-shape triangle-deco"></div>
            <div class="deco-shape square-deco"></div>

            <div class="graphic-container">
                <div class="hexagon-wrapper">
                    <!-- Glow hexagon SVG background -->
                    <div class="hex-glow"></div>
                    <!-- Service expert photo -->
                    <img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=400&fit=crop&q=80" alt="ConnectLocal Pro" class="hex-avatar">
                    <div class="hex-icon-overlay">
                        <i class="fas fa-wrench"></i>
                    </div>
                </div>
            </div>

            <!-- Testimonial / Features Slider -->
            <div class="slider-caption">
                <h3 id="slider-title">Find Trusted Help, Anywhere Nearby</h3>
                <p id="slider-desc">Connect with verified local professionals for home repairs, maintenance, academic tutoring, and lifestyle services.</p>
                <div class="slider-dots">
                    <span class="dot active" onclick="switchSlide(0)"></span>
                    <span class="dot" onclick="switchSlide(1)"></span>
                    <span class="dot" onclick="switchSlide(2)"></span>
                </div>
            </div>
        </section>

    </main>

    <!-- Project JS Modules -->
    <script src="../js/utils.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
